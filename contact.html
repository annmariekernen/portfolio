<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Ann Marie Kernen</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon_32px.png" />
  <link rel="stylesheet" href="/styles-v3.css" />
</head>
<body>

  <nav class="top-nav">
    <div class="top-nav-inner">
      <a href="/" class="top-nav-logo">Ann Marie Kernen</a>
      <div class="top-nav-links">
        <a href="/">Work</a>
        <a href="/about.html">About</a>
        <a href="/contact.html" class="is-active">Contact</a>
      </div>
    </div>
  </nav>

  <section class="band reveal">
    <div class="band-inner" style="padding-top:48px;">
      <div class="section-marker">
        <h2>Contact</h2>
      </div>

      <div class="contact-links">
        <a href="https://www.linkedin.com/in/annmariekernen" target="_blank" class="icon-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="8" y1="11" x2="8" y2="16"/>
            <circle cx="8" cy="8" r="0.6" fill="currentColor"/>
            <path d="M12 16v-3a2 2 0 0 1 4 0v3"/>
            <line x1="12" y1="11" x2="12" y2="16"/>
          </svg>
          LinkedIn ↗
        </a>
        <a href="https://github.com/annmariekernen" target="_blank" class="icon-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="8 6 3 12 8 18"/>
            <polyline points="16 6 21 12 16 18"/>
          </svg>
          GitHub ↗
        </a>
        <a href="/assets/resumes/Ann-Marie-Kernen-Resume.pdf" target="_blank" class="icon-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/>
            <polyline points="14 3 14 8 19 8"/>
            <line x1="9" y1="13" x2="15" y2="13"/>
            <line x1="9" y1="17" x2="15" y2="17"/>
          </svg>
          Resume ↗
        </a>
      </div>
      <p style="font-size:15px; color:var(--fg-3); margin-top:20px;">Fill out the form below to reach out. Slide decks for case studies are available upon request.
      </p>

      <div style="margin-top:24px;">
        <form id="contactForm" onsubmit="handleSubmit(event)">
          <div class="field">
            <label class="meta caps" for="name">Your name</label>
            <input type="text" id="name" name="name" placeholder="First Last" required />
          </div>
          <div class="field">
            <label class="meta caps" for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@email.com" required />
          </div>
          <div class="field">
            <label class="meta caps" for="message">Message</label>
            <textarea id="message" name="message" placeholder="Tell me what you're working on..." required></textarea>
          </div>
          <button type="submit" class="btn btn--green">Submit</button>
        </form>

        <div class="form-success" id="formSuccess">
          ✦ Message sent — I'll be in touch soon.
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-inner">
      <span>© 2026 Ann Marie Kernen</span>
      <span class="footer-links">
        <a href="/">Work</a>
        <a href="/about.html">About</a>
        <a href="/contact.html">Contact</a>
        <a href="https://www.linkedin.com/in/annmariekernen" target="_blank">LinkedIn ↗</a>
      </span>
    </div>
  </footer>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      const form = document.getElementById('contactForm');
      const success = document.getElementById('formSuccess');
      form.style.display = 'none';
      success.style.display = 'block';
    }
  </script>

  <script src="/site.js"></script>

</body>
</html>
