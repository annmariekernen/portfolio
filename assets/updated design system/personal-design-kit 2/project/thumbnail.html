<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><link rel="stylesheet" href="styles.css"/>
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}.tile{display:grid;grid-template-columns:1fr 300px;width:1280px;height:854px}.mark{background:#1E86EE;display:flex;align-items:center;justify-content:center;padding:0 48px}.mark span{font-family:var(--font-display);font-variation-settings:'wdth' 82;font-weight:700;font-size:104px;line-height:1;letter-spacing:-.03em;color:#FFFEFC;text-align:center}.strip{display:grid;grid-template-rows:repeat(4,1fr);height:854px}.strip i{display:block}</style>
</head><body>
<div class="tile">
<div class="mark"><span>Personal<br/>Design Kit</span></div>
<div class="strip"><i style="background:#8FA5C4"></i><i style="background:#16B37E"></i><i style="background:#08815A"></i><i style="background:#0B6BD6"></i></div>
</div>
</body></html>
