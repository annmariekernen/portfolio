<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo" subtitle="Name wordmark · on paper and on ink" viewport="700x200" -->
<html lang="en"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/><style>.r{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pane{height:120px;display:flex;align-items:center;justify-content:center;border:var(--border-default);background:var(--bone)}
.pane.ink{background:var(--ink)}
.wm{font-family:var(--font-body);font-variation-settings:'wdth' 100;font-weight:400;font-size:13px;letter-spacing:0.28em;text-transform:uppercase;color:var(--ink);margin-right:-0.28em}
.ink .wm{color:var(--paper)}</style></head><body>
<div class="card"><div class="r">
<div class="pane"><span class="wm">Ann Marie Kernen</span></div>
<div class="pane ink"><span class="wm">Ann Marie Kernen</span></div>
</div></div>
</body></html>
