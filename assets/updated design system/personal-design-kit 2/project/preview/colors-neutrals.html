<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Neutrals" subtitle="Warm charcoal darks, warm near-white papers" viewport="700x170" -->
<html lang="en"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/><style>.sw-grid{grid-template-columns:repeat(7,1fr)}</style></head><body>
<div class="card"><div class="sw-grid">
  <div class="sw" style="background:var(--bone)"><span class="n">Bone</span><span class="h">#FFFEFC</span></div>
  <div class="sw" style="background:var(--paper)"><span class="n">Paper</span><span class="h">#FBF9F6</span></div>
  <div class="sw" style="background:var(--paper-2)"><span class="n">Paper 2</span><span class="h">#F4F1EB</span></div>
  <div class="sw" style="background:var(--rule)"><span class="n">Rule</span><span class="h">#D2CCC2</span></div>
  <div class="sw on-dark" style="background:var(--ink-faint)"><span class="n">Ink faint</span><span class="h">#756D62</span></div>
  <div class="sw on-dark" style="background:var(--ink-soft)"><span class="n">Ink soft</span><span class="h">#494339</span></div>
  <div class="sw on-dark" style="background:var(--ink)"><span class="n">Ink</span><span class="h">#221F1C</span></div>
</div></div>
</body></html>
