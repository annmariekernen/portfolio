<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Accents" subtitle="Blues and greens · lifted, flat, never tinted" viewport="700x340" -->
<html lang="en"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/><style>.sw-grid{grid-template-columns:repeat(4,1fr)}.sw-grid+.sw-grid{border-top:0}</style></head><body>
<div class="card"><div class="kick">▸ Blue — bright azure · action, links, data</div>
<div class="sw-grid">
  <div class="sw" style="background:var(--blue-pale)"><span class="n">Blue pale</span><span class="h">#DEE9F6</span></div>
  <div class="sw" style="background:var(--mist)"><span class="n">Mist</span><span class="h">#8FA5C4</span></div>
  <div class="sw" style="background:var(--blue)"><span class="n">Blue · fills</span><span class="h">#1E86EE</span></div>
  <div class="sw on-dark" style="background:var(--blue-deep)"><span class="n">Blue deep · action</span><span class="h">#0B6BD6</span></div>
</div>
<div class="kick" style="margin-top:22px">▸ Green — emerald · secondary action, system-OK</div>
<div class="sw-grid">
  <div class="sw" style="background:var(--green-pale)"><span class="n">Green pale</span><span class="h">#D9EDE3</span></div>
  <div class="sw" style="background:var(--green)"><span class="n">Green · fills</span><span class="h">#16B37E</span></div>
  <div class="sw on-dark" style="background:var(--green-deep)"><span class="n">Green deep · alt · ok</span><span class="h">#08815A</span></div>
  <div class="sw on-dark" style="background:var(--rust)"><span class="n">Rust · warn</span><span class="h">#C2603F</span></div>
</div></div>
</body></html>
