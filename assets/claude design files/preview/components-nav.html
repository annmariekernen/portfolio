<!DOCTYPE html>
<!-- @dsCard group="Components" name="Nav & chrome" subtitle="Site nav, case study nav, and in-case section nav" viewport="700x340" -->
<html lang="en"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/><style>.stack{display:grid;gap:18px}
.lbl{font-family:var(--font-body);font-variant-caps:var(--caps-variant);font-feature-settings:var(--caps-features);letter-spacing:var(--ls-caps);font-size:12px;font-weight:500;color:var(--fg-3);margin-bottom:6px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 18px;background:var(--paper)}
.wm{font-family:var(--font-body);font-variation-settings:'wdth' 100;font-weight:400;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.caps{font-family:var(--font-body);font-variant-caps:var(--caps-variant);font-feature-settings:var(--caps-features);letter-spacing:var(--ls-caps);text-transform:none;font-size:14px;font-weight:600;text-decoration:none;color:var(--fg-2)}
a.caps:hover{color:var(--fg-1)}
.links{display:flex;gap:20px}
.links a.on{color:var(--fg-1)}
.case{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:20px}
.case .pos{display:flex;align-items:center;gap:8px;color:var(--fg-3);font-weight:500}
.dot{width:8px;height:8px;border-radius:var(--radius-full);background:var(--green-deep)}
.sub{display:flex;gap:6px;padding:10px 18px;background:var(--paper-2)}
.sub a{padding:8px 14px}
.sub a.on{background:var(--blue-deep);color:var(--bone)}</style></head><body>
<div class="card stack">
<div><div class="lbl">Site nav</div><div class="bar"><span class="wm">Ann Marie Kernen</span><span class="links"><a href="#w" class="caps on">Work</a><a href="#a" class="caps">About</a><a href="#c" class="caps">Contact</a></span></div></div>
<div><div class="lbl">Case study nav + section nav</div>
<div class="bar case"><span class="wm">Ann Marie Kernen</span><a href="#p" class="caps">◂ Prev</a><span class="caps pos"><span class="dot"></span>Case 02 / 03</span><span></span><a href="#n" class="caps">Next ▸</a></div>
<div class="sub"><a href="#s" class="caps on">Summary</a><a href="#d" class="caps">Discovery</a><a href="#de" class="caps">Design</a><a href="#o" class="caps">Outcome</a></div></div>
</div>
</body></html>
