<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Hairline vocabulary" subtitle="0.75px, 1px · all light-grey rule, never coloured" viewport="700x220" -->
<html lang="en"><head><meta charset="UTF-8"/><link rel="stylesheet" href="_card.css"/><style>.b{padding:14px 16px;margin-bottom:12px;background:var(--bone)}
.lbl{font-family:var(--font-body);font-variant-caps:var(--caps-variant);font-feature-settings:var(--caps-features);letter-spacing:var(--ls-caps);text-transform:none;font-size:13px;font-weight:500;color:var(--fg-3)}</style></head><body>
<div class="card"><div class="b" style="border:var(--border-hairline)"><span class="lbl">--border-hairline · 0.75px — table cells, internal detail</span></div>
<div class="b" style="border:var(--border-default)"><span class="lbl">--border-default · 1px — the signature. cards, buttons</span></div>
<div class="b" style="border-top:var(--border-divider);border-bottom:var(--border-divider);background:transparent"><span class="lbl">--border-divider · 1px rule — quiet internal dividers</span></div></div>
</body></html>
